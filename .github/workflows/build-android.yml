# GitHub Actions Workflow: Auto-build Android APK using barichello/godot-ci
# This is the industry-standard approach used by thousands of Godot projects.
# Uses pre-configured Docker image with Godot + Android SDK + templates.
#
# BASED ON: https://github.com/barichello/godot-ci

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: AuraBlocks

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    container:
      image: barichello/godot-android:4.3
    
    steps:
      # ---------- Step 1: Checkout ----------
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ---------- Step 2: Setup Godot config ----------
      - name: Setup Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings.cfg << 'EOF'
          [filesystem]
          import/android_android_sdk_path="/usr/local/android-sdk"
          import/android_jdk_path="/usr/lib/jvm/temurin-17-jdk-amd64"
          
          [export]
          android/debug_keystore=""
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_password="android"
          EOF
      
      # ---------- Step 3: Setup export templates ----------
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ 2>/dev/null || true
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || echo "Templates not in expected location"
      
      # ---------- Step 4: Import project resources ----------
      - name: Import project resources
        run: |
          godot --headless --import --path . 2>&1 | head -50 || true
      
      # ---------- Step 5: Setup Android SDK + Gradle ----------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # ---------- Step 6: Create debug keystore ----------
      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -storepass android -keypass android -keystore ~/.android/debug.keystore 2>&1 || true
          ls -la ~/.android/debug.keystore || echo "Keystore creation skipped"
      
      # ---------- Step 7: Build Android APK ----------
      - name: Build Android Debug APK
        run: |
          echo "=========================================="
          echo "  Building Aura Blocks Android APK"
          echo "=========================================="
          mkdir -p build
          
          godot --headless --path . --export-debug "Android" build/$EXPORT_NAME.apk 2>&1 | tee build_log.txt
          
          echo "---"
          echo "Build output:"
          ls -la build/ 2>&1
          
          if [ -f "build/$EXPORT_NAME.apk" ]; then
            echo "=========================================="
            echo "  ✅ APK BUILD SUCCESSFUL!"
            echo "  Size: $(du -h build/$EXPORT_NAME.apk | cut -f1)"
            echo "=========================================="
          else
            echo "=========================================="
            echo "  ❌ APK BUILD FAILED - check build_log.txt"
            echo "=========================================="
            cat build_log.txt
            exit 1
          fi
      
      # ---------- Step 8: Upload APK artifact ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraBlocks-debug-apk
          path: build/${{ env.EXPORT_NAME }}.apk
          retention-days: 30
          if-no-files-found: warn
      
      # ---------- Step 9: Upload build log ----------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7
          if-no-files-found: warn
