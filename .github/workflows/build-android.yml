# GitHub Actions Workflow: Auto-build Android APK
# Uses direct Godot engine + Android SDK setup (no Docker)

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: AuraBlocks
  PROJECT_PATH: .

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-v3
      
      - name: Download Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version
      
      - name: Download Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          cp templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest'
      
      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      
      - name: Create debug keystore
        run: |
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android \
            -keystore ~/.android/debug.keystore 2>&1 || true
          ls -la ~/.android/debug.keystore
      
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          # Use printf to avoid heredoc indentation issues
          printf '[filesystem]\n' > ~/.config/godot/editor_settings.cfg
          printf 'import/android_android_sdk_path="%s"\n' "$ANDROID_HOME" >> ~/.config/godot/editor_settings.cfg
          printf 'import/android_jdk_path="%s"\n' "$JAVA_HOME" >> ~/.config/godot/editor_settings.cfg
          printf '\n[export]\n' >> ~/.config/godot/editor_settings.cfg
          printf 'android/debug_keystore="%s/.android/debug.keystore"\n' "$HOME" >> ~/.config/godot/editor_settings.cfg
          printf 'android/debug_keystore_user="androiddebugkey"\n' >> ~/.config/godot/editor_settings.cfg
          printf 'android/debug_keystore_password="android"\n' >> ~/.config/godot/editor_settings.cfg
          echo "=== Editor settings ==="
          cat ~/.config/godot/editor_settings.cfg
          echo "=== Android SDK check ==="
          ls $ANDROID_HOME/platforms/ 2>&1
          ls $ANDROID_HOME/build-tools/ 2>&1
      
      - name: Import project resources
        run: |
          ./godot --headless --import --path $PROJECT_PATH 2>&1 | head -100 || true
      
      - name: Verify Android Build Template
        run: |
          if [ -d "android/build" ]; then
            echo "✅ Android build template found"
            ls android/build/ | head -10
          else
            echo "❌ Android build template NOT found"
            exit 1
          fi
      
      - name: Build Android Debug APK
        run: |
          echo "=========================================="
          echo "  Building Aura Blocks Android APK"
          echo "=========================================="
          mkdir -p build
          
          # Run Godot export with verbose output
          ./godot --headless --verbose --path $PROJECT_PATH --export-debug "Android" build/$EXPORT_NAME.apk 2>&1 | tee build_log.txt
          
          echo "---"
          echo "Build output:"
          ls -la build/ 2>&1
          
          if [ -f "build/$EXPORT_NAME.apk" ]; then
            echo "=========================================="
            echo "  ✅ APK BUILD SUCCESSFUL!"
            echo "  Size: $(du -h build/$EXPORT_NAME.apk | cut -f1)"
            echo "=========================================="
          else
            echo "=========================================="
            echo "  ❌ APK BUILD FAILED"
            echo "=========================================="
            exit 1
          fi
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraBlocks-debug-apk
          path: build/${{ env.EXPORT_NAME }}.apk
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7
          if-no-files-found: warn
