# GitHub Actions Workflow: Auto-build Android APK from Godot project
# 
# HOW IT WORKS:
# 1. Push code to GitHub (any branch)
# 2. This workflow runs automatically
# 3. Downloads Godot 4 engine + Android export templates
# 4. Builds debug APK
# 5. Uploads APK as downloadable artifact
#
# TRIGGERS:
# - Push to main/master branch
# - Pull request to main
# - Manual trigger (workflow_dispatch)
#
# BASED ON: https://github.com/barichello/godot-ci

name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'data/**'
      - 'assets/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  GODOT_VERSION: 4.3
  EXPORT_NAME: AuraBlocks
  PROJECT_PATH: .

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    
    steps:
      # ---------- Step 1: Checkout ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # ---------- Step 2: Cache Godot engine (saves build time) ----------
      - name: Cache Godot Engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            godot
            godot_templates
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-stable
      
      # ---------- Step 3: Download Godot Engine ----------
      - name: Download Godot Engine
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Godot $GODOT_VERSION stable..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot
          echo "Godot engine downloaded."
          ./godot --version
      
      # ---------- Step 4: Download export templates ----------
      - name: Download Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Godot export templates..."
          mkdir -p godot_templates
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates godot_templates/
          echo "Templates downloaded."
      
      # ---------- Step 5: Setup Java (for Android build) ----------
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      # ---------- Step 6: Setup Android SDK ----------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      
      # ---------- Step 7: Configure Godot editor settings ----------
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings.cfg << 'EOF'
          [filesystem]
          import/android_android_sdk_path="/usr/local/lib/android/sdk"
          import/android_jdk_path="/opt/hostedtoolcache/jdk"
          
          [export]
          android/debug_keystore=""
          android/debug_keystore_user="androiddebugkey"
          android/debug_keystore_password="android"
          EOF
      
      # ---------- Step 8: Setup export templates path ----------
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "Templates installed to: ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      
      # ---------- Step 9: Import project resources ----------
      - name: Import Godot project resources
        run: |
          echo "Importing project resources..."
          ./godot --headless --import --path $PROJECT_PATH 2>&1 | head -50 || true
          echo "Import complete."
      
      # ---------- Step 10: Build Android APK ----------
      - name: Build Android Debug APK
        run: |
          echo "Building Android APK..."
          mkdir -p build
          
          # Determine build type (default: debug from push, manual override possible)
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Build type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "release" ]; then
            ./godot --headless --path $PROJECT_PATH --export-release "Android" build/$EXPORT_NAME.apk 2>&1 | tee build_log.txt
          else
            ./godot --headless --path $PROJECT_PATH --export-debug "Android" build/$EXPORT_NAME.apk 2>&1 | tee build_log.txt
          fi
          
          echo "Build complete."
          ls -la build/
      
      # ---------- Step 11: Verify APK exists ----------
      - name: Verify APK
        run: |
          if [ ! -f "build/$EXPORT_NAME.apk" ]; then
            echo "ERROR: APK file not found!"
            echo "=== Build log ==="
            cat build_log.txt
            exit 1
          fi
          echo "APK file size: $(du -h build/$EXPORT_NAME.apk | cut -f1)"
          echo "APK file path: build/$EXPORT_NAME.apk"
      
      # ---------- Step 12: Upload APK artifact ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraBlocks-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: build/$EXPORT_NAME.apk
          retention-days: 30
          if-no-files-found: error
      
      # ---------- Step 13: Upload build log ----------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7
          if-no-files-found: warn
      
      # ---------- Step 14: Summary ----------
      - name: Build Summary
        if: always()
        run: |
          echo "========================================"
          echo "  AURA BLOCKS - BUILD SUMMARY"
          echo "========================================"
          echo "Build type: ${{ github.event.inputs.build_type || 'debug' }}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"
          if [ -f "build/$EXPORT_NAME.apk" ]; then
            echo "APK Size: $(du -h build/$EXPORT_NAME.apk | cut -f1)"
            echo "Download from: Actions > This run > Artifacts"
          fi
          echo "========================================"
